{% extends "base.html" %}
{% block title %}Register — Crop Advisor{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="auth-logo-icon">🌱</div>
      <h1>Create Account</h1>
      <p>Start getting smarter crop recommendations</p>
    </div>

    <!-- FIX: autocomplete="off" prevents browser from pre-filling any field -->
    <form method="POST" autocomplete="off">
      <div class="form-group">
        <label class="form-label">Full Name</label>
        <input class="form-input" type="text" name="name"
               placeholder="Your name"
               autocomplete="off" required>
      </div>
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input class="form-input" type="email" name="email"
               placeholder="farmer@example.com"
               autocomplete="off" required>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <!-- FIX: new-password suppresses password autofill (browsers ignore "off" for passwords) -->
        <input class="form-input" type="password" name="password"
               placeholder="At least 8 characters"
               autocomplete="new-password" required>
      </div>
      <div class="form-group">
        <label class="form-label">Location (City, Country)</label>
        <input class="form-input" type="text" name="location"
               placeholder="e.g. Hyderabad, India"
               autocomplete="off">
        <div class="form-hint">Used to auto-fetch live weather data for your area</div>
      </div>
      <button type="submit" class="btn btn-primary"
              style="width:100%;justify-content:center;margin-top:.5rem">
        Create Account →
      </button>
    </form>

    <div class="auth-footer">
      Already have an account? <a href="{{ url_for('login') }}">Login</a>
    </div>
  </div>
</div>
{% endblock %}
